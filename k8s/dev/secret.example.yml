# Same shape as ../secret.example.yml but for the campmenu-dev namespace.
# Copy to secret.yml (gitignored), fill, `kubectl apply -f`. Repo is public
# here so GIT_USERNAME/GIT_TOKEN can stay empty.
apiVersion: v1
kind: Secret
metadata:
  name: campmenu-secrets
  namespace: campmenu-dev
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_random_string_min_32_chars"
  SETTINGS_ENC_KEY: ""
  BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
  BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_strong_password"
  BOOTSTRAP_ADMIN_NAME: "Admin"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: "no-reply@campmenu.local"
  GIT_USERNAME: ""
  GIT_TOKEN: ""
