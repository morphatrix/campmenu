# Separate CloudNativePG instance for dev — isolated from the prod database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: campmenu-dev-db
  namespace: campmenu-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 2Gi
    storageClass: freenas-nfs-csi
  bootstrap:
    initdb:
      database: campmenu
      owner: campmenu
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
